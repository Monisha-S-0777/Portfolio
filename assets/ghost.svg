<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" style="background:#0F111A;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,sans-serif;">
  <defs>
    <linearGradient id="g-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="g-hud" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(139,92,246,0.15)"/>
      <stop offset="100%" stop-color="rgba(15,17,26,0.85)"/>
    </linearGradient>
    <radialGradient id="g-radar" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(139,92,246,0.35)"/>
      <stop offset="70%" stop-color="rgba(99,102,241,0.08)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>

  <!-- Background Grid -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="675" fill="url(#grid)" />

  <!-- App Header / Window Bar -->
  <rect x="30" y="24" width="1140" height="52" rx="12" fill="#181B26" stroke="rgba(255,255,255,0.08)" />
  <circle cx="58" cy="50" r="6" fill="#FF5F56" />
  <circle cx="78" cy="50" r="6" fill="#FFBD2E" />
  <circle cx="98" cy="50" r="6" fill="#27C93F" />
  <text x="130" y="55" fill="#FFFFFF" font-size="14" font-weight="600" letter-spacing="0.5">GHOST 3D NAVIGATOR // GNSS-DENIED VEHICLE TRACKING [SIH 2026]</text>
  <rect x="940" y="38" width="210" height="24" rx="6" fill="rgba(16,185,129,0.15)" stroke="rgba(16,185,129,0.3)" />
  <circle cx="954" cy="50" r="4" fill="#10B981" />
  <text x="966" y="54" fill="#10B981" font-size="11" font-weight="600">GNSS OUTAGE: 60s ACTIVE</text>

  <!-- 3D Viewport / Canvas Area -->
  <rect x="30" y="92" width="760" height="555" rx="14" fill="#141724" stroke="rgba(139,92,246,0.25)" />
  
  <!-- Radar sweep circles -->
  <circle cx="410" cy="370" r="210" fill="url(#g-radar)" stroke="rgba(139,92,246,0.25)" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="410" cy="370" r="140" fill="none" stroke="rgba(139,92,246,0.35)" stroke-width="1"/>
  <circle cx="410" cy="370" r="70" fill="none" stroke="rgba(139,92,246,0.45)" stroke-width="1"/>
  <line x1="200" y1="370" x2="620" y2="370" stroke="rgba(139,92,246,0.2)" stroke-width="1"/>
  <line x1="410" y1="160" x2="410" y2="580" stroke="rgba(139,92,246,0.2)" stroke-width="1"/>

  <!-- Simulated Roads & Heading constraints -->
  <path d="M 220 540 Q 320 460 380 370 T 560 190" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="18" stroke-linecap="round"/>
  <!-- Pure Dead Reckoning (Drifting red) -->
  <path d="M 220 540 Q 330 440 430 340 T 630 150" fill="none" stroke="#F43F5E" stroke-width="3" stroke-dasharray="6 4" stroke-opacity="0.8"/>
  <text x="635" y="155" fill="#F43F5E" font-size="11" font-family="monospace">Without GHOST (+11.8% Drift)</text>

  <!-- GHOST 5-State EKF + CNN (Tight violet track) -->
  <path d="M 220 540 Q 320 460 380 370 T 560 190" fill="none" stroke="#A78BFA" stroke-width="4"/>
  <circle cx="380" cy="370" r="9" fill="#8B5CF6" stroke="#FFFFFF" stroke-width="2.5"/>
  <text x="396" y="375" fill="#A78BFA" font-size="12" font-weight="700">Vehicle Pos: 2.40% Drift (SIH &lt;10%)</text>

  <!-- Telemetry Overlay in Viewport -->
  <rect x="50" y="112" width="240" height="110" rx="10" fill="rgba(15,17,26,0.85)" stroke="rgba(255,255,255,0.1)"/>
  <text x="66" y="136" fill="#8E8E9A" font-size="10" font-family="monospace" letter-spacing="1">SENSOR FUSION METRICS</text>
  <text x="66" y="160" fill="#FFFFFF" font-size="13" font-weight="600">PyTorch 1D-CNN Speed</text>
  <text x="66" y="180" fill="#10B981" font-size="18" font-weight="700">64.2 km/h <tspan fill="#8E8E9A" font-size="11">(±0.4)</tspan></text>
  <text x="66" y="204" fill="#A78BFA" font-size="11">5-State EKF + OSM Heading Lock</text>

  <!-- Right Telemetry Panel -->
  <rect x="810" y="92" width="360" height="268" rx="14" fill="#141724" stroke="rgba(255,255,255,0.08)" />
  <text x="834" y="126" fill="#FFFFFF" font-size="14" font-weight="600">Algorithm Performance</text>
  <text x="834" y="146" fill="#8E8E9A" font-size="11">Comparison across 60s GNSS Blackout</text>

  <!-- Bar 1 -->
  <text x="834" y="180" fill="#D1D5DB" font-size="12">SIH Drift Requirement</text>
  <text x="1115" y="180" fill="#D1D5DB" font-size="12" text-anchor="end">≤ 10.0%</text>
  <rect x="834" y="190" width="310" height="10" rx="5" fill="rgba(255,255,255,0.08)" />
  <rect x="834" y="190" width="180" height="10" rx="5" fill="#6B7280" />

  <!-- Bar 2 -->
  <text x="834" y="226" fill="#F43F5E" font-size="12">Standard Dead Reckoning</text>
  <text x="1115" y="226" fill="#F43F5E" font-size="12" text-anchor="end">11.84% (Failed)</text>
  <rect x="834" y="236" width="310" height="10" rx="5" fill="rgba(255,255,255,0.08)" />
  <rect x="834" y="236" width="260" height="10" rx="5" fill="#F43F5E" />

  <!-- Bar 3 -->
  <text x="834" y="272" fill="#10B981" font-size="12" font-weight="600">GHOST Hybrid AI Fusion</text>
  <text x="1115" y="272" fill="#10B981" font-size="12" font-weight="700" text-anchor="end">2.40% (Pass)</text>
  <rect x="834" y="282" width="310" height="10" rx="5" fill="rgba(255,255,255,0.08)" />
  <rect x="834" y="282" width="65" height="10" rx="5" fill="#10B981" />

  <text x="834" y="325" fill="#8E8E9A" font-size="11" font-family="monospace">CALIBRATION: Isotonic Regression</text>

  <!-- Right Lower Tech Stack Block -->
  <rect x="810" y="378" width="360" height="269" rx="14" fill="#141724" stroke="rgba(255,255,255,0.08)" />
  <text x="834" y="412" fill="#FFFFFF" font-size="14" font-weight="600">Stack &amp; Frameworks</text>
  
  <g transform="translate(834, 430)">
    <rect x="0" y="0" width="150" height="42" rx="8" fill="rgba(139,92,246,0.12)" stroke="rgba(139,92,246,0.3)"/>
    <text x="14" y="26" fill="#A78BFA" font-size="12" font-weight="600">PyTorch 1D-CNN</text>

    <rect x="160" y="0" width="150" height="42" rx="8" fill="rgba(99,102,241,0.12)" stroke="rgba(99,102,241,0.3)"/>
    <text x="174" y="26" fill="#818CF8" font-size="12" font-weight="600">Extended Kalman</text>

    <rect x="0" y="52" width="150" height="42" rx="8" fill="rgba(244,63,94,0.12)" stroke="rgba(244,63,94,0.3)"/>
    <text x="14" y="78" fill="#FB7185" font-size="12" font-weight="600">Scikit-learn</text>

    <rect x="160" y="52" width="150" height="42" rx="8" fill="rgba(14,165,233,0.12)" stroke="rgba(14,165,233,0.3)"/>
    <text x="174" y="78" fill="#38BDF8" font-size="12" font-weight="600">Three.js / R3F</text>

    <rect x="0" y="104" width="150" height="42" rx="8" fill="rgba(16,185,129,0.12)" stroke="rgba(16,185,129,0.3)"/>
    <text x="14" y="130" fill="#34D399" font-size="12" font-weight="600">NumPy &amp; SciPy</text>

    <rect x="160" y="104" width="150" height="42" rx="8" fill="rgba(245,158,11,0.12)" stroke="rgba(245,158,11,0.3)"/>
    <text x="174" y="130" fill="#FBBF24" font-size="12" font-weight="600">OSM Constraints</text>
  </g>
  <text x="834" y="618" fill="#8E8E9A" font-size="11" font-family="monospace">SIH 2026 // Team Lead: Monisha S</text>
</svg>