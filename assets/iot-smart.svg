  <g transform="translate(66, 530)" font-family="monospace" font-size="11">
    <text x="0" y="0" fill="#38BDF8">import serial, time, json</text>
    <text x="0" y="20" fill="#94A3B8">ser = serial.Serial('/dev/ttyUSB0', 115200, timeout=1)</text>
    <text x="0" y="40" fill="#10B981">def read_sensor_payload(): data = ser.readline().decode('utf-8').strip()</text>
    <text x="0" y="60" fill="#FBBF24">if int(data.get('distance')) &lt; 20: trigger_relay_actuator(state=True)</text>
